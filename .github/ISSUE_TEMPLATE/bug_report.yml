name: Bug report
description: Something isn't working the way it should.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a report. The fields below are
        required because a CLI bug report without them is usually
        unreproducible.

  - type: input
    id: version
    attributes:
      label: agyloop version
      description: Output of `agyloop --version`
      placeholder: "0.1.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Other Unix-like (specify below)
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version
      description: Output of `python3 --version`
      placeholder: "Python 3.12.4"
    validations:
      required: true

  - type: input
    id: command
    attributes:
      label: Exact command you ran
      placeholder: "agyloop run handoff.md --preset low --max-turns 40"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the exact error message or unexpected output.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: >-
        Paste relevant lines from the run's events.jsonl or --log-file.
        Redact any API keys, tokens, or sensitive file contents first.
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: Anything else?
