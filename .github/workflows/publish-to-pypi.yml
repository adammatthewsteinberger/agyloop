name: Publish to PyPI

# This filename is load-bearing: PyPI's Trusted Publisher configuration for
# the `agyloop` project matches on the workflow FILENAME
# `publish-to-pypi.yml` exactly. Renaming this file requires updating that
# configuration at pypi.org first, or every subsequent release will fail
# with an OIDC identity mismatch. See docs/contributing/release-process.md.
# (reindexed for workflow_dispatch discovery)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish"
        required: true
        default: "testpypi"
        type: choice
        options:
          - testpypi
          - pypi

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build

      - name: Verify package metadata
        run: twine check --strict dist/*

      - name: Confirm py.typed ships in the wheel
        run: unzip -l dist/*.whl | grep -q py.typed

      - name: Install the built wheel into a clean venv and run the console script
        run: |
          python -m venv /tmp/agyloop-smoke
          /tmp/agyloop-smoke/bin/pip install --upgrade pip
          /tmp/agyloop-smoke/bin/pip install dist/*.whl
          /tmp/agyloop-smoke/bin/agyloop --version
          /tmp/agyloop-smoke/bin/agyloop --help

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    name: Publish to TestPyPI (dry run)
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/agyloop
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish:
    name: Publish to PyPI (Trusted Publishing)
    needs: build
    if: github.event_name == 'release' || inputs.target == 'pypi'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/agyloop
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
